[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcrdp"
version = "6.0.0"
description = "RheoPlus/RheoCompass data processing GUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "PySide6==6.11.1",
]

[project.scripts]
mcrdp = "mcrdp.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
